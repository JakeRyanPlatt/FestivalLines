name: FestivalLines
# Requires a .env file at the repo root, DB_PASSWORD is redacted
services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build: ./backend/FestivalLineupAPI
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=festivallines;Username=festivaladmin;Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=festivallines
      - POSTGRES_USER=festivaladmin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festivaladmin -d festivallines"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:

